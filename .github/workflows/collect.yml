# 워크플로 A — 일일 수집·선정.
#
# 여기까지가 무인 자동화의 전부다. 조사·원고·렌더는 로컬에서 사람이 돌린다.
#
# 왜 여기서 끊는가: research/compose 는 LLM 호출이라 CI 에서 돌리려면 API 키가
# 필요하다. 무료 대안을 조사했으나 GitHub Models 는 2026-07 종료, Groq 는 단일
# 요청 8K TPM 벽, Actions 로컬 추론은 16GB RAM 초과로 전부 막혔고, 남은 Gemini
# 무료 티어는 한국어 리더보드에 근거가 없다. 반면 로컬은 Claude Code 구독으로
# 이미 무과금이다 — 발행물의 한국어 품질을 지키면서 돈도 안 드는 쪽을 택했다.
#
# 매일 아침 이 잡이 "오늘의 레포"를 골라 커밋해두면,
# 사람은 편할 때 `python -m agent run` 만 돌리면 된다.

name: collect

on:
  schedule:
    # KST 10:00 = UTC 01:00
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

# 스냅샷 파일을 커밋해 되밀기 때문에 동시 실행이 겹치면 push 가 충돌한다.
# 진행 중인 실행을 취소하지는 않되(수집 데이터 유실 방지) 직렬화한다.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          # 이력이 커져도 실행 시간에 영향이 없도록 얕은 클론 (SPEC 2.3)
          fetch-depth: 1

      - name: Python 3.12 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: 수집
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m agent collect

      - name: 발행 이력 신선도 확인
        # 재발행 차단은 원격의 data/published.json 하나에 걸려 있다. 로컬에서
        # mark-published 를 돌린 뒤 푸시하지 않으면 이 러너는 낡은 이력으로
        # 선정하고, 어제 올린 레포를 오늘 또 고른다 (2026-08-26 taste-skill).
        # 조용히 지나가지 않도록 이력이 오래되면 요약에 경고를 남긴다.
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, pathlib, sys
          from datetime import date, timedelta

          sys.stdout.reconfigure(encoding="utf-8")  # 로케일과 무관하게 한글·이모지를 낸다
          STALE_DAYS = 3
          p = pathlib.Path("data/published.json")
          posts = json.loads(p.read_text(encoding="utf-8")).get("posts", []) if p.exists() else []
          latest = max((str(x.get("date", "")) for x in posts), default="")
          cutoff = (date.today() - timedelta(days=STALE_DAYS)).isoformat()

          if not latest:
              print(f"> ⚠️ **발행 이력이 비어 있습니다** — `{p}` 에 기록이 없어 재발행 차단이 동작하지 않습니다.")
          elif latest < cutoff:
              print(
                  f"> ⚠️ **발행 이력이 낡았습니다** — 원격의 마지막 기록이 `{latest}` 로 "
                  f"{STALE_DAYS}일 넘게 갱신되지 않았습니다.\n>\n"
                  "> 로컬에서 발행한 뒤 `data/published.json` 을 푸시하지 않았다면, "
                  "오늘 선정이 이미 올린 레포를 다시 고를 수 있습니다. "
                  "`python -m agent mark-published` 는 이제 커밋·푸시까지 합니다."
              )
          else:
              print(f"발행 이력 최신: {latest} (총 {len(posts)}건)")
          PY

      - name: 선정
        # 오늘의 레포를 고른다. 사람이 로컬에서 `agent run` 을 돌릴 때
        # 이 결과(data/selection/{date}.json)를 입력으로 쓴다.
        # 후보 0개는 정상 종료(exit 0)이므로 실패로 잡히지 않는다.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m agent select | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 상태 출력
        run: python -m agent status

      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋하지 않습니다."
            exit 0
          fi
          git commit -m "chore(data): $(date -u +%Y-%m-%d) 수집 스냅샷"

          # 정상 경로는 그냥 push 다. concurrency 그룹이 이 워크플로끼리의
          # 경합을 막아주므로 충돌은 사람이 그 사이 main 에 푸시한 경우뿐이다.
          # 그때만 얕은 클론을 풀어 rebase 한다 — 얕은 상태로 rebase 하면
          # 히스토리가 잘려 있어 실패할 수 있기 때문이다.
          if ! git push origin main; then
            echo "push 충돌 — 원격 변경을 반영해 재시도합니다."
            git fetch --unshallow origin main || git fetch origin main
            git pull --rebase origin main
            git push origin main
          fi
