# 워크플로 A(일부) — 일일 수집.
#
# SPEC.md 9.1 의 워크플로 A 중 collect/select 단계만 먼저 띄운 것이다.
# star velocity 는 스냅샷이 쌓여야 계산되므로(Δ1d 2일, Δ7d 7일),
# research/compose/render 를 만들기 전에 이 잡부터 돌려 데이터를 모은다.

name: collect

on:
  schedule:
    # KST 10:00 = UTC 01:00
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

# 스냅샷 파일을 커밋해 되밀기 때문에 동시 실행이 겹치면 push 가 충돌한다.
# 진행 중인 실행을 취소하지는 않되(수집 데이터 유실 방지) 직렬화한다.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          # 이력이 커져도 실행 시간에 영향이 없도록 얕은 클론 (SPEC 2.3)
          fetch-depth: 1

      - name: Python 3.12 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: 수집
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m agent collect

      - name: 선정 (카나리)
        # 아직 research/compose 가 없어 결과를 소비하지 않는다.
        # 파이프라인이 실제로 끝까지 도는지 매일 확인하는 용도다.
        # 후보 0개는 정상 종료(exit 0)이므로 실패로 잡히지 않는다.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m agent select

      - name: 상태 출력
        run: python -m agent status

      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋하지 않습니다."
            exit 0
          fi
          git commit -m "chore(data): $(date -u +%Y-%m-%d) 수집 스냅샷"

          # 정상 경로는 그냥 push 다. concurrency 그룹이 이 워크플로끼리의
          # 경합을 막아주므로 충돌은 사람이 그 사이 main 에 푸시한 경우뿐이다.
          # 그때만 얕은 클론을 풀어 rebase 한다 — 얕은 상태로 rebase 하면
          # 히스토리가 잘려 있어 실패할 수 있기 때문이다.
          if ! git push origin main; then
            echo "push 충돌 — 원격 변경을 반영해 재시도합니다."
            git fetch --unshallow origin main || git fetch origin main
            git pull --rebase origin main
            git push origin main
          fi
